site_name: pymol-molviz
site_description: Visualization presets for PyMOL, for lipid bilayers, proteins and peptides
site_url: https://madsondeluna.com/pymol-vitral/
repo_url: https://github.com/madsondeluna/pymol-vitral
repo_name: madsondeluna/pymol-vitral
edit_uri: ""

docs_dir: docs

theme:
  name: material
  language: en
  # A tipografia vem da Pure Design Language, nao do Material: Public Sans para
  # linguagem, Spline Sans Mono para dado, Archivo para titulo de secao.
  font: false
  palette:
    # primary e accent ficam em 'custom' de proposito. Com uma cor nomeada, o
    # Material declara --md-typeset-a-color e companhia no proprio <body>, onde
    # o atributo mora, e essa declaracao local vence a heranca dos tokens: o
    # link sai azul indigo no meio de uma paleta de grafite. Em 'custom' ele
    # nao injeta cor nenhuma e o mapeamento da Pure e o unico que vale.
    - scheme: pure
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    # Sumario da pagina na coluna da esquerda, dentro da navegacao, em vez da
    # coluna direita separada.
    - toc.integrate
    - content.code.copy
    - search.highlight

extra_javascript:
  - pure/scheme.js

extra_css:
  - https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300;400&family=Public+Sans:wght@300;400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap
  - pure/tokens.css
  - pure/mkdocs.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite

nav:
  # Uma pagina so com tudo: os vinte presets, as imagens e os comandos. O
  # sumario na coluna esquerda e o indice dela.
  - pymol-molviz: index.md
  - Reference (Portuguese):
      - Passo a passo: passo-a-passo.md
      - Presets: presets.md
      - Limitacoes: limitacoes.md
      - Adaptacao: adaptacao.md
      - Decisoes: decisoes.md

not_in_nav: |
  img/
